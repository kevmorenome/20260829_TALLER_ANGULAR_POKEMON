<div
  class="backdrop"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'Detalles de ' + pokemon.name"
>
  <div class="modal">
    <button class="modal__close" type="button" (click)="onClose()" aria-label="Cerrar">
      &times;
    </button>

    <header class="modal__header" [style.background]="headerColor">
      <div class="modal__header-text">
        <span class="modal__id">{{ paddedId }}</span>
        <h2 class="modal__name">{{ pokemon.name }}</h2>
        <div class="modal__types">
          <span
            class="modal__type"
            *ngFor="let t of pokemon.types"
            [style.background]="typeColor(t.type.name)"
          >
            {{ typeLabel(t.type.name) }}
          </span>
        </div>
      </div>
      <img class="modal__image" [src]="image" [alt]="'Imagen de ' + pokemon.name" />
    </header>

    <div class="modal__body">
      <div class="facts">
        <div class="fact">
          <span class="fact__value">{{ pokemon.height / 10 }} m</span>
          <span class="fact__label">Altura</span>
        </div>
        <div class="fact">
          <span class="fact__value">{{ pokemon.weight / 10 }} kg</span>
          <span class="fact__label">Peso</span>
        </div>
        <div class="fact">
          <span class="fact__value">{{ pokemon.base_experience }}</span>
          <span class="fact__label">Exp. base</span>
        </div>
      </div>

      <section class="section">
        <h3 class="section__title">Habilidades</h3>
        <div class="abilities">
          <span class="ability" *ngFor="let a of pokemon.abilities">
            {{ a.ability.name }}
            <em *ngIf="a.is_hidden">(oculta)</em>
          </span>
        </div>
      </section>

      <section class="section">
        <h3 class="section__title">Estadísticas base</h3>
        <div class="stats">
          <div class="stat" *ngFor="let s of pokemon.stats">
            <span class="stat__name">{{ statLabel(s.stat.name) }}</span>
            <span class="stat__value">{{ s.base_stat }}</span>
            <div class="stat__bar">
              <div
                class="stat__fill"
                [style.width.%]="statPercent(s.base_stat)"
                [style.background]="headerColor"
              ></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
