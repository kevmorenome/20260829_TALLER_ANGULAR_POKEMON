    <div id="contenedor-formulario" class="contenedor">
        <header id="encabezado-formulario">
            <h1 id="titulo-formulario">Formulario</h1>
        </header>

        <main id="contenido-formulario">
            <form id="formulario-registro" (ngSubmit)="guardarUsuario()">
                <div id="campo-nombre" class="grupo-campo">
                    <label id="etiqueta-nombre" for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <div id="campo-apellido" class="grupo-campo">
                    <label id="etiqueta-apellido" for="apellido">Apellido:</label>
                    <input type="text" id="apellido" [(ngModel)]="apellido" name="apellido" placeholder="Ingresa tu apellido" required>
                </div>

                <div id="campo-tipo-documento" class="grupo-campo">
                    <label id="etiqueta-tipo-documento" for="tipo-documento">Tipo de identificación:</label>
                    <select id="tipo-documento" [(ngModel)]="tipo_doc" name="tipo_documento" required>
                        <option value="" disabled selected>Seleccione el tipo de documento</option>
                        <option value="12">Tarjeta de identidad (12)</option>
                        <option value="13">Cédula de ciudadanía (13)</option>
                        <option value="21">Cédula de extranjería (21)</option>
                        <option value="41">Pasaporte (41)</option>
                    </select>
                </div>

                <div id="campo-numero-documento" class="grupo-campo">
                    <label id="etiqueta-numero-documento" for="numero-documento">Número de identificación:</label>
                    <input type="text" id="numero-documento" [(ngModel)]="dni" name="numero_documento" placeholder="Ejemplo: 123456789" required>
                </div>

                <div id="campo-fecha-nacimiento" class="grupo-campo">
                    <label id="etiqueta-fecha-nacimiento" for="fecha-nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fecha-nacimiento" [(ngModel)]="fecha_nacimiento" name="fecha_nacimiento" placeholder="Selecciona tu fecha de nacimiento" required>
                </div>

                <div id="campo-email" class="grupo-campo">
                    <label id="etiqueta-email" for="email">Correo electronico</label>
                    <input type="email" id="email" [(ngModel)]="correo" name="email" placeholder="Ingresa tu correo" required>
                </div>

                <div id="campo-celular" class="grupo-campo">
                    <label id="etiqueta-celular" for="celular">Número de celular:</label>
                    <input type="tel" id="celular" [(ngModel)]="numCel" name="numero_celular" placeholder="Ejemplo: 3001234567" required>
                </div>

                <div id="campo-pais" class="grupo-campo">
                    <label id="etiqueta-pais" for="pais">País de domicilio:</label>
                    <select id="pais" [(ngModel)]="pais" name="pais_residencia" required>
                        <option value="" disabled>Seleccione un país</option>
                        <option value="249">Estados Unidos (249)</option>
                        <option value="169" selected>Colombia (169)</option>
                        <option value="245">España (245)</option>
                    </select>
                </div>

                <div id="campo-ciudad" class="grupo-campo">
                    <label id="etiqueta-ciudad" for="ciudad">Ciudad de domicilio:</label>
                    <select id="ciudad" [(ngModel)]="ciudad" name="ciudad_residencia" required>
                        <option value="" disabled selected>Seleccione una ciudad</option>
                        <optgroup label="Estados Unidos (249)">
                            <option value="US-NY">Nueva York</option>
                            <option value="US-LA">Los Ángeles</option>
                            <option value="US-CH">Chicago</option>
                            <option value="US-HO">Houston</option>
                            <option value="US-MI">Miami</option>
                        </optgroup>
                        <optgroup label="Colombia (169)">
                            <option value="11001">Bogotá, D. C.</option>
                            <option value="05001">Medellín</option>
                            <option value="76001">Cali</option>
                            <option value="08001">Barranquilla</option>
                            <option value="13001">Cartagena</option>
                        </optgroup>
                        <optgroup label="España (245)">
                            <option value="ES-MD">Madrid</option>
                            <option value="ES-BCN">Barcelona</option>
                            <option value="ES-V">Valencia</option>
                            <option value="ES-SE">Sevilla</option>
                            <option value="ES-BI">Bilbao</option>
                        </optgroup>
                    </select>
                </div>

                <div id="campo-politica" class="grupo-campo">
                    <input type="checkbox" id="politica" [(ngModel)]="politica" name="politica" required>
                    <label id="etiqueta-politica" for="politica">Acepto la política de tratamiento de datos</label>
                </div>

                <div id="campo-envio" class="grupo-campo">
                    <button id="boton-enviar" type="submit">Enviar</button>
                </div>
            </form>

            <div>
